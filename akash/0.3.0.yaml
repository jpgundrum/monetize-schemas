apiVersion: node-provider.peaq.network/v1alpha1
kind: ProviderProvisioningManifest

metadata:
  provider: akash
  displayName: Akash Compute Provider
  category: compute
  version: "0.3.0"
  docs: https://akash.network/docs/providers/getting-started/

execution:
  supportedModes: [manual, auto]
  defaultMode: manual
  runner: { shell: bash, workingDirectory: /root/provider-playbooks, requiresLocalAgent: true }
  sudo:
    autoModeRequiresGrant: true
    grantPrompt: Allow the SDK to install packages, clone provider playbooks, configure Kubernetes, install Akash provider services, and run verification commands.
    allowedCommands:
      - { prefix: apt-get }
      - { prefix: git }
      - { prefix: ssh-keygen }
      - { prefix: ansible-playbook }
      - { prefix: kubectl }
      - { prefix: provider-services }
      - { prefix: systemctl }
      - { prefix: command }
      - { prefix: curl }
      - { prefix: base64 }
      - { prefix: printf }

inputs:
  - { key: providerDomain, label: Provider domain, type: hostname, required: true, secret: false, help: "Public DNS name of this provider. For tests, sslip.io works: <ip-with-dashes>.sslip.io" }
  - { key: nodePublicIp, label: Node public IP, type: string, required: true, secret: false, help: "The public IPv4 of this host (must exist on a local interface; the playbook verifies this). e.g. 203.0.113.10" }
  - { key: organizationName, label: Organization name, type: string, required: true, secret: false }
  - { key: organizationEmail, label: Organization email, type: string, required: true, secret: false }
  - { key: organizationWebsite, label: Organization website, type: url, required: false, secret: false }
  - { key: locationRegion, label: Location region, type: string, required: true, secret: false, help: "Example: us-central" }
  - { key: clusterMode, label: Kubernetes setup mode, type: enum, required: true, default: k3s, validation: { values: [k3s] }, secret: false }
  - { key: chainId, label: Akash chain ID, type: string, required: true, default: sandbox-2, secret: false, help: "sandbox-2 for the Akash sandbox; akashnet-2 for mainnet" }
  - { key: rpcNode, label: Akash RPC node, type: url, required: true, default: "https://rpc.sandbox-2.aksh.pw:443", secret: false, help: "Chain RPC endpoint matching chainId. Mainnet: https://rpc.akashnet.net:443" }
  - { key: withdrawalPeriod, label: Withdrawal period, type: string, required: false, default: "24h", secret: false }
  - { key: providerHostAttr, label: Provider host attribute, type: string, required: false, default: akash, secret: false }
  - { key: providerTier, label: Provider tier attribute, type: string, required: false, default: community, secret: false }
  - { key: enableGpu, label: Enable GPU support, type: bool, required: false, default: false, secret: false }
  - { key: enablePersistentStorage, label: Enable Rook-Ceph persistent storage, type: bool, required: false, default: false, secret: false }
  - { key: enableIpLeases, label: Enable IP leases, type: bool, required: false, default: false, secret: false }
  - { key: walletMode, label: Wallet setup mode, type: enum, required: true, default: generate, validation: { values: [generate] }, secret: false }
  - { key: walletPassword, label: Wallet password, type: string, required: true, secret: true, help: "MINIMUM 8 CHARACTERS — the file keyring backend hard-rejects shorter passphrases." }

preflight:
  checks:
    - id: linux
      description: Confirm Linux host.
      command: uname -s
      sudo: never
      expect: { exitCode: 0, stdoutContains: Linux }
      onFailure: block
    - id: x86-64
      description: Confirm x86_64 architecture.
      command: uname -m
      sudo: never
      expect: { exitCode: 0, stdoutContains: x86_64 }
      onFailure: block
    - id: public-ip-present
      description: Confirm the declared public IP exists on a local interface (the k3s role hard-fails otherwise).
      command: ip -4 addr | grep -q "{{ inputs.nodePublicIp }}"
      sudo: never
      expect: { exitCode: 0 }
      onFailure: block
    - id: dns-preview
      description: Show DNS target for owner confirmation.
      command: "printf 'public_ip=' && curl -s ifconfig.me && printf '\\ndns=' && dig +short {{ inputs.providerDomain }}"
      sudo: never
      expect: { exitCode: 0 }
      onFailure: warn

phases:
  - id: host-prereqs
    title: Install host prerequisites
    description: Install packages needed to run the Akash Provider Playbook and verification commands.
    steps:
      - id: apt-prereqs
        title: Install base packages
        mode: both
        kind: command
        sudo: required
        command: apt-get update && apt-get install -y git curl jq yq unzip python3.12 python3.12-venv python3-pip ansible dnsutils python3-kubernetes && curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.2/grpcurl_1.9.2_linux_x86_64.tar.gz | tar -xz -C /usr/local/bin grpcurl
        idempotency: { rerun: safe }
      - id: clone-playbooks
        title: Clone Akash Provider Playbooks
        mode: both
        kind: command
        sudo: required
        command: test -d /root/provider-playbooks/.git || git clone https://github.com/akash-network/provider-playbooks.git /root/provider-playbooks
        idempotency: { rerun: safe }
      - id: install-provider-services
        title: Install Akash provider-services binary
        mode: both
        kind: command
        sudo: required
        command: 'command -v provider-services >/dev/null 2>&1 || { curl -sfL https://raw.githubusercontent.com/akash-network/provider/main/install.sh | bash && install -m 0755 "$HOME/bin/provider-services" /usr/local/bin/provider-services; }'
        idempotency: { rerun: safe }

  - id: inventory-and-wallet
    title: Prepare inventory and wallet
    description: Render the node inventory, create the provider wallet, export its key for the playbook, and render host_vars.
    steps:
      - id: render-inventory
        title: Render Ansible inventory
        mode: both
        kind: render-file
        sudo: required
        file:
          path: /root/provider-playbooks/inventory.yml
          owner: root
          mode: "0600"
          content: |
            all:
              children:
                kube_control_plane:
                  hosts:
                    node1:
                      ansible_host: {{ inputs.nodePublicIp }}
                      ansible_connection: local
                      ansible_user: root
                      internal_ip: {{ inputs.nodePublicIp }}
                kube_node:
                  hosts:
                    node1:
                      ansible_host: {{ inputs.nodePublicIp }}
                      ansible_connection: local
                      ansible_user: root
                      internal_ip: {{ inputs.nodePublicIp }}
                provider:
                  hosts:
                    node1:
                      ansible_host: {{ inputs.nodePublicIp }}
                      ansible_connection: local
                      ansible_user: root
                      internal_ip: {{ inputs.nodePublicIp }}
        produces:
          - { key: ansibleInventory, path: /root/provider-playbooks/inventory.yml, description: Akash Ansible inventory, secret: false }

      - id: generate-wallet
        title: Generate provider wallet
        mode: both
        kind: command
        sudo: required
        command: provider-services keys show provider --keyring-backend file --keyring-dir /root/.akash >/dev/null 2>&1 || provider-services keys add provider --keyring-backend file --keyring-dir /root/.akash
        prompts:
          - { name: keyring-passphrase, question: Enter keyring passphrase, responseFrom: input, valueRef: walletPassword, secret: true }
          - { name: confirm-passphrase, question: Re-enter keyring passphrase, responseFrom: input, valueRef: walletPassword, secret: true }
        produces:
          - { key: providerWallet, path: /root/.akash/keyring-file, description: Provider wallet keyring, secret: true }
        redaction: ["{{ inputs.walletPassword }}"]
      - id: capture-provider-address
        title: Capture provider wallet address
        mode: both
        kind: command
        sudo: required
        command: 'provider-services keys show provider -a --keyring-backend file --keyring-dir /root/.akash 2>&1'
        prompts:
          - { name: keyring-passphrase, question: Enter keyring passphrase, responseFrom: input, valueRef: walletPassword, secret: true }
        captures:
          - { key: providerAddress, source: stdout, pattern: "akash1[a-z0-9]+", secret: false }
        redaction: ["{{ inputs.walletPassword }}"]

      - id: export-provider-key
        title: Export provider key for the playbook
        mode: both
        kind: command
        sudo: required
        command: 'printf "%s\n%s\n" "{{ inputs.walletPassword }}" "{{ inputs.walletPassword }}" | provider-services keys export provider --keyring-backend file --keyring-dir /root/.akash 2>/root/.akash/export.raw; sed -n "/-----BEGIN TENDERMINT PRIVATE KEY-----/,/-----END TENDERMINT PRIVATE KEY-----/p" /root/.akash/export.raw > /root/.akash/provider-export.pem && test -s /root/.akash/provider-export.pem && base64 -w0 /root/.akash/provider-export.pem > /root/.akash/provider_b64_key && printf "%s" "{{ inputs.walletPassword }}" | base64 -w0 > /root/.akash/provider_b64_keysecret && rm -f /root/.akash/export.raw && chmod 0600 /root/.akash/provider-export.pem /root/.akash/provider_b64_key /root/.akash/provider_b64_keysecret'
        redaction: ["{{ inputs.walletPassword }}"]
        produces:
          - { key: providerB64Key, path: /root/.akash/provider_b64_key, description: Base64 provider key for the playbook, secret: true }
          - { key: providerB64KeySecret, path: /root/.akash/provider_b64_keysecret, description: Base64 key passphrase for the playbook, secret: true }

      - id: render-host-vars
        title: Render provider variables
        mode: both
        kind: render-file
        sudo: required
        file:
          path: /root/provider-playbooks/host_vars/node1.yml
          owner: root
          mode: "0600"
          content: |
            akash1_address: "{{ captures.providerAddress }}"
            domain: "{{ inputs.providerDomain }}"
            node: "{{ inputs.rpcNode }}"
            withdrawal_period: "{{ inputs.withdrawalPeriod }}"
            email: "{{ inputs.organizationEmail }}"
            website: "{{ inputs.organizationWebsite }}"
            region: "{{ inputs.locationRegion }}"
            host: "{{ inputs.providerHostAttr }}"
            tier: "{{ inputs.providerTier }}"
            organization: "{{ inputs.organizationName }}"
        produces:
          - { key: providerHostVars, path: /root/provider-playbooks/host_vars/node1.yml, description: Provider playbook variables, secret: false }

      - id: fund-wallet
        title: Fund provider wallet
        mode: both
        kind: owner-action
        sudo: never
        ownerAction:
          instructions: "Fund {{ captures.providerAddress }} with enough AKT for gas, bid deposits, and provider operation before continuing. Sandbox: request from the faucet listed in https://raw.githubusercontent.com/akash-network/net/main/{{ inputs.chainId }}/meta.json (sandbox-2: https://faucet.sandbox-2.aksh.pw/ — POST to /faucet with form field 'address'). Verify with: provider-services query bank balances {{ captures.providerAddress }} --node {{ inputs.rpcNode }}"
          expectedConfirmation: Owner confirms the AKT wallet is funded.

  - id: install-provider
    title: Install Kubernetes and Akash provider
    description: Run the Provider Playbook. This is the main tedious setup the SDK hides.
    steps:
      - id: setup-ssh-access
        title: Prepare SSH access to cluster nodes
        mode: both
        kind: command
        sudo: required
        command: test -f /root/.ssh/id_rsa || ssh-keygen -t rsa -N "" -f /root/.ssh/id_rsa
        idempotency: { rerun: safe }
      - id: run-playbook
        title: Run Akash Provider Playbook
        mode: both
        kind: command
        sudo: required
        cwd: /root/provider-playbooks
        command: 'export AKASH_NODE="{{ inputs.rpcNode }}" AKASH_CHAIN_ID="{{ inputs.chainId }}" && ansible-playbook -i /root/provider-playbooks/inventory.yml /root/provider-playbooks/playbooks.yml -t os,k3s,provider -e "provider_b64_key=$(cat /root/.akash/provider_b64_key)" -e "provider_b64_keysecret=$(cat /root/.akash/provider_b64_keysecret)" -e "akash1_address={{ captures.providerAddress }}"'
        timeoutSeconds: 7200
        produces:
          - { key: kubeconfig, path: /etc/rancher/k3s/k3s.yaml, description: k3s admin kubeconfig (k3s path, not kubeadm's /etc/kubernetes/admin.conf), secret: true }
        idempotency: { rerun: requires-confirmation }

  - id: register-provider
    title: Register provider onchain
    description: Register or update the provider record with host URI and attributes.
    steps:
      - id: provider-create
        title: Create or update Akash provider
        mode: both
        kind: command
        sudo: required
        command: provider-services tx provider create /root/provider/provider.yaml --from provider --keyring-backend file --keyring-dir /root/.akash --node {{ inputs.rpcNode }} --chain-id {{ inputs.chainId }} --gas auto --gas-adjustment 1.4 --gas-prices 0.0025uakt --yes
        prompts:
          - { name: keyring-passphrase, question: Enter keyring passphrase, responseFrom: input, valueRef: walletPassword, secret: true }
        captures:
          - { key: providerTxHash, source: stdout, pattern: "[A-Fa-f0-9]{32,64}", secret: false }
        redaction: ["{{ inputs.walletPassword }}"]
        idempotency: { rerun: requires-confirmation }

  - id: verify-provider
    title: Run provider smoke checks
    description: Check that Kubernetes, provider status, gRPC, and bid logs are available.
    steps:
      - id: kubectl-pods
        title: Show Akash provider pods
        mode: both
        kind: verify
        sudo: required
        command: kubectl -n akash-services get pods
      - id: provider-status
        title: Check provider status endpoint
        mode: both
        kind: verify
        sudo: never
        command: curl -k https://{{ inputs.providerDomain }}:8443/status
      - id: provider-grpc
        title: Check provider gRPC endpoint
        mode: both
        kind: verify
        sudo: never
        command: grpcurl -insecure {{ inputs.providerDomain }}:8444 akash.provider.v1.ProviderRPC.GetStatus

verification:
  probes:
    - id: provider-pod-running
      title: Provider pod is running
      command: kubectl -n akash-services get pods -l app=akash-provider
      sudo: required
      expect: { exitCode: 0, stdoutContains: Running }
    - id: provider-onchain-registration
      title: Provider is registered onchain
      command: provider-services query provider get {{ captures.providerAddress }} --node {{ inputs.rpcNode }}
      sudo: required
      expect: { exitCode: 0 }
    - id: provider-status-http
      title: Provider status endpoint works
      command: curl -k https://{{ inputs.providerDomain }}:8443/status
      sudo: never
      expect: { exitCode: 0 }
    - id: provider-status-grpc
      title: Provider gRPC status works
      command: grpcurl -insecure {{ inputs.providerDomain }}:8444 akash.provider.v1.ProviderRPC.GetStatus
      sudo: never
      expect: { exitCode: 0 }
  success:
    allOf:
      - provider-pod-running
      - provider-onchain-registration
      - provider-status-http
      - provider-status-grpc

postProvision:
  operations:
    - id: view-provider-logs
      title: Tail Akash provider logs
      mode: both
      sudo: required
      actor: local-agent
      command: kubectl -n akash-services logs -l app=akash-provider --tail=100 -f
      redactsSecrets: false
    - id: view-provider-init-logs
      title: Show provider init-container logs (cert bootstrap failures surface here)
      mode: both
      sudo: required
      actor: local-agent
      command: kubectl -n akash-services logs akash-provider-0 -c init --tail=100
      redactsSecrets: false
    - id: check-provider-balance
      title: Check provider wallet balance
      mode: both
      sudo: required
      actor: local-agent
      command: provider-services query bank balances {{ captures.providerAddress }} --node {{ inputs.rpcNode }}
      redactsSecrets: false